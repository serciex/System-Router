# System Router configuration (spec v3, contract v0.3).
# Paths are relative to the repository root unless absolute.
# Override any value from the command line with --set key.sub=value.

paths:
  system_one: "system one"         # sgoedecke/system-one submodule (the constrained-choice method)
  model: "models/Qwen3.5-9B"       # local repo or Hugging Face id, e.g. Qwen/Qwen3.5-4B
  runs: "runs"                     # logs and step records
  r2dreamer: "dreamer v3"          # unused under v3 (world model removed)

llm:
  dtype: bfloat16                  # bfloat16 | float16 | float32
  quantization: none               # none | 4bit | 8bit (bitsandbytes)
  device_map: auto
  s2_max_new_tokens: 768           # think budget
  s2_temperature: 0.0

system1:
  labels: letters                  # two-letter labels, unique across both questions
  max_options: 100                 # per question

loop:
  think_below: 0.35                # hard rule: think when the top pick's probability is below this
  change_threshold: 0.5            # mean pixel difference that counts as a window change
  goal_max_age: 5                  # steps before a word goal expires (also dropped on window change)
  history_lines: 20
  wait_cap_s: 2.0
  wait_poll_s: 0.1
  narrow_min_px: 12                # narrowing stops when the region is this small
  narrow_max_depth: 6
  collapse_over: 12                # web adapter: groups larger than this are collapsed

body:
  adapter: web                     # web | fallback | code

goal:
  stall_steps: 8                   # steps on one subtask before think replans

rewards:                           # training only, protected core
  dec: {a: 0.2, b: 1.0, p: 0.5, p_irr: 2.0, q: 0.5, kappa: 0.05}
  expected_latency_ms: 500

limits:                            # protected core, read-only to the LLM
  allow_irreversible: false
  allowed_verbs: [click, double_click, right_click, hover, type, select, scroll_up, scroll_down, drag, press_key,
                  open, read, search, write, run]

env:
  suite: miniwob                   # miniwob | workspace | desktop
  tasks: [click-test-2, click-button, click-link, focus-text, enter-text, login-user]
  max_steps: 30
  render: false

workspace:                         # code workspace body (adapter writing)
  root: "runs/workspace"
  goal: ""

conformance:
  hidden_dir: "conformance_hidden" # hidden split, never shown to the model (git-ignored)

silent:                            # stage 6, off until both swap tests pass
  enabled: false
  soft_tokens: 6
  max_steps: 3
